  hypothesis: "A credentialed French consultant publishes an AI agent (trained on their knowledge and fronted by their verified pedigree) that answers their audience 24/7 and produces deliverables, so the consultant earns passively by usage while their audience gets on-demand access to that specific trusted expert."
  wedge: "Automated verified credentials as the trust frame + usage-based payouts with no monthly fee to the expert and model costs covered + multi-expert deliverables — aimed squarely at Delphi's 'monetization isn't built in' gap (E16) and Miria's premium, fame-gated framing (E11)."
  mvp_shape: "Recruit 3-5 credentialed consultants from one named niche, publish credential-fronted agents with one paid deliverable on the existing Avee V2 product, and pre-sell their existing audiences a one-to-one subscription (landing page + Stripe checkout)."
  not_doing:
    - "Regulated advice categories (health, finance, legal) in the wedge"
    - "Per-agent subscriptions (platform subscription with usage limits only — founder decision)"
    - "Price, max acquisition cost, budget, thresholds, call-to-action and landing-page copy (P/S Fitter decides)"

