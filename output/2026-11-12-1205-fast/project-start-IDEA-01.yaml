risks:
  - assumption: "An expert's own audience will pay a recurring subscription (~20-25 EUR/mo) for that expert's AI agent — not the human."
    category: "desirability"
    why_uncertain: "The strongest proven WTP is for reaching the human (Intro premium calls, JustAnswer live experts) or for a self-set price; a weak clone draws 'just like a normal ChatGPT chat, no real reason to use this' (E17), and audiences say 'it feels fake, I want the real person'. Recurring WTP for AI delivery at Avee's price is the core unproven leap."
    evidence_ids: ["E17", "E20", "E13"]
    how_to_test: "Pre-sell 3-5 recruited consultants' existing audiences a one-to-one AI subscription (landing page + Stripe checkout) and measure paid conversion."
